<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Google Sheet Shortcuts</title>
<style>
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f5f5f7;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{width:92%;max-width:420px;padding:36px;background:rgba(255,255,255,0.55);backdrop-filter:blur(18px);border-radius:22px;box-shadow:0 10px 25px rgba(0,0,0,0.08);text-align:center}
  h1{margin:0 0 22px;font-size:24px}
  .btn{display:block;width:100%;padding:14px;margin:12px 0;border-radius:12px;text-decoration:none;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff8800,#e23670);box-shadow:0 6px 14px rgba(0,0,0,0.08);transition:transform .18s}
  .btn:hover{transform:translateY(-3px)}
</style>
</head>
<body>
  <div class="card">
    <h1>Google Sheet Shortcuts</h1>
    <a class="btn" href="YOUR_SHEET_LINK_1" target="_blank">Student Tracker</a>
    <a class="btn" href="YOUR_SHEET_LINK_2" target="_blank">Attendance</a>
    <a class="btn" href="YOUR_SHEET_LINK_3" target="_blank">Expenses</a>
    <a class="btn" href="YOUR_SHEET_LINK_4" target="_blank">Sales</a>
  </div>
</body>
</html>
